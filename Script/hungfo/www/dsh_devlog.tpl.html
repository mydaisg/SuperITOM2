<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HungFo 开发日志</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2937}
  header{background:#0d47a1;color:#fff;padding:16px 24px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{margin-top:4px;font-size:12px;opacity:.85}
  .wrap{padding:16px 24px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .bar input,.bar select,.bar button{padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff}
  .bar input[type=search]{flex:1;min-width:220px}
  .bar button{cursor:pointer}
  .bar .count{margin-left:auto;font-size:12px;color:#64748b}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  th{background:#eef2f7;text-align:left;padding:10px 12px;font-size:12px;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tr:hover td{background:#f8fafc;cursor:pointer}
  .no{font-family:Consolas,monospace;font-size:11px;color:#64748b;white-space:nowrap}
  .title{font-weight:500}
  .date{color:#64748b;font-size:12px;white-space:nowrap}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px}
  .tag.draft{background:#fef3c7;color:#92400e}
  .tag.other{background:#e0e7ff;color:#3730a3}
  mark{background:#fde68a;padding:0 2px;border-radius:2px}
  #detail{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
  #detail.open{display:flex}
  #detail .box{background:#fff;border-radius:10px;max-width:820px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  #detail .hd{padding:16px 20px;border-bottom:1px solid #e2e8f0}
  #detail .hd h2{margin:0 0 6px;font-size:16px}
  #detail .hd .meta{font-size:12px;color:#64748b;font-family:Consolas,monospace}
  #detail .bd{padding:16px 20px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.7}
  #detail .ft{padding:12px 20px;border-top:1px solid #e2e8f0;text-align:right}
  #detail button{padding:7px 16px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
  .empty{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>HungFo 开发日志</h1>
  <div class="sub">__SUBTITLE__</div>
</header>
<div class="wrap">
  <div class="bar">
    <input type="search" id="q" placeholder="搜索标题 / 正文 / 编号…">
    <select id="month">__MONTHS__</select>
    <select id="status">
      <option value="">全部状态</option>
      <option value="draft">draft</option>
      <option value="正式">正式</option>
    </select>
    <button id="reset">重置</button>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr><th style="width:190px">编号</th><th>标题</th><th style="width:130px">日期</th><th style="width:80px">状态</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div id="detail"><div class="box">
  <div class="hd"><h2 id="d-title"></h2><div class="meta" id="d-meta"></div></div>
  <div class="bd" id="d-body"></div>
  <div class="ft"><button id="d-close">关闭</button></div>
</div></div>
<script>
var RECORDS = __DATA__;
var tbody = document.getElementById('tbody');
var qEl = document.getElementById('q');
var monthEl = document.getElementById('month');
var statusEl = document.getElementById('status');
var countEl = document.getElementById('count');

function hl(text, kw) {
  if (!kw) return text;
  var lower = String(text).toLowerCase();
  var k = kw.toLowerCase();
  var i = lower.indexOf(k);
  if (i < 0) return text;
  return text.slice(0, i) + '<mark>' + text.slice(i, i + k.length) + '</mark>' + text.slice(i + k.length);
}

function render() {
  var kw = qEl.value.trim();
  var m = monthEl.value;
  var st = statusEl.value;
  var rows = RECORDS.filter(function (r) {
    if (m && r.date.slice(0, 7) !== m) return false;
    if (st && r.status !== st) return false;
    if (kw) {
      var hay = (r.title + ' ' + r.payload + ' ' + r.no).toLowerCase();
      if (hay.indexOf(kw.toLowerCase()) < 0) return false;
    }
    return true;
  });
  countEl.textContent = '显示 ' + rows.length + ' / ' + RECORDS.length + ' 条';
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">没有匹配的记录</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var cls = r.status === 'draft' ? 'draft' : 'other';
    html += '<tr data-id="' + r.id + '">' +
      '<td class="no">' + hl(r.no, kw) + '</td>' +
      '<td class="title">' + hl(r.title, kw) + '</td>' +
      '<td class="date">' + r.date + '</td>' +
      '<td><span class="tag ' + cls + '">' + r.status + '</span></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

tbody.addEventListener('click', function (e) {
  var tr = e.target.closest ? e.target.closest('tr[data-id]') : null;
  if (!tr) return;
  var id = tr.getAttribute('data-id');
  var r = null;
  for (var i = 0; i < RECORDS.length; i++) { if (String(RECORDS[i].id) === String(id)) { r = RECORDS[i]; break; } }
  if (!r) return;
  document.getElementById('d-title').textContent = r.title;
  document.getElementById('d-meta').textContent = r.no + ' · ' + r.date + ' · ' + r.status + ' · ' + r.module;
  document.getElementById('d-body').textContent = r.payload || '（无正文）';
  document.getElementById('detail').classList.add('open');
});

document.getElementById('d-close').addEventListener('click', function () {
  document.getElementById('detail').classList.remove('open');
});
document.getElementById('detail').addEventListener('click', function (e) {
  if (e.target.id === 'detail') document.getElementById('detail').classList.remove('open');
});
document.getElementById('reset').addEventListener('click', function () {
  qEl.value = ''; monthEl.value = ''; statusEl.value = ''; render();
});
qEl.addEventListener('input', render);
monthEl.addEventListener('change', render);
statusEl.addEventListener('change', render);
render();
</script>
</body>
</html>
